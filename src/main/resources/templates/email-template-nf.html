<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Nota Fiscal - [[${nomeCliente}]]</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4;">

<table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f4; padding: 20px 0;">
    <tr>
        <td align="center">
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background-color: #ffffff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                <tr>
                    <td align="center" style="padding-bottom: 20px;">
                        <h2 style="color: #333333;">Olá, <span th:text="${nomeCliente}">Cliente</span>,</h2>
                        <p style="color: #555555; font-size: 16px;">
                            Segue abaixo o link para download da sua Nota Fiscal referente ao pedido
                            <strong th:text="${numeroPedido}">#0000</strong>.
                        </p>
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding: 20px 0;">
                        <a th:href="@{${linkNotaFiscal}}"
                           style="background-color: #28a745; color: #ffffff; text-decoration: none; padding: 12px 24px; border-radius: 5px; display: inline-block; font-size: 16px;">
                            📄 Baixar Nota Fiscal
                        </a>
                    </td>
                </tr>

                <tr>
                    <td style="color: #777777; font-size: 14px; text-align: center; padding-top: 20px;">
                        Caso tenha alguma dúvida, entre em contato com o nosso suporte.<br><br>
                        Obrigado por escolher a <strong th:text="${nomeEmpresa}">Sua Empresa</strong>!
                    </td>
                </tr>

                <tr>
                    <td align="center" style="padding-top: 30px; font-size: 12px; color: #aaaaaa;">
                        © <span th:text="${ano}">2025</span> <span th:text="${nomeEmpresa}">Sua Empresa</span>. Todos os direitos reservados.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>

</body>
</html>
